spring.application.name=test
server.port=8081

# use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema is owned by Flyway migrations (src/main/resources/db/migration).
# Hibernate only checks that entities match the migrated schema, it never changes it.
spring.jpa.hibernate.ddl-auto=validate

# Spring Boot's default naming strategy rewrites column names to snake_case
# even when @Column(name=...) is given explicitly. This strategy leaves
# @Column names exactly as written, which is what the camelCase columns in
# the migrations need.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# turn on the browser console so you can see your data
spring.h2.console.enabled=true