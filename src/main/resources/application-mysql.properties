# The team's MySQL database. Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Settings here override application.properties.
# Credentials come from environment variables so they are never committed:
#   export DB_URL=jdbc:mysql://localhost:3306/outreachDB DB_USERNAME=... DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/outreachDB}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# The Database team owns this schema, so Flyway must not create or change it.
# Hibernate still checks on startup that the entities match the real tables.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false
